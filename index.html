<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản Lý Đề Thi Trắc Nghiệm</title>
<style>
  :root {
    --bg-main: #140f0a;
    --bg-card: #241b13;
    --bg-palette: #1c140e;
    --border-color: #4a3723;
    --primary: #d97706;
    --primary-hover: #b45309;
    --text-main: #f5f5f4;
    --text-muted: #a8a29e;
    --success: #10b981;
    --danger: #ef4444;
  }

  * { box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: var(--bg-main);
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(217, 119, 6, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 10% 90%, rgba(217, 119, 6, 0.05) 0%, transparent 40%);
    color: var(--text-main);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* --- TOP BAR --- */
  .top-bar {
    background: #1c140e;
    border-bottom: 1px solid var(--border-color);
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    top: 0; left: 0; width: 100%;
    z-index: 1000;
    height: 60px;
  }
  .top-left { display: flex; align-items: center; gap: 16px; font-weight: bold; font-size: 16px; }
  .top-right { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  
  .score-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .score-badge.correct { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
  .score-badge.wrong { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
  
  .btn-toggle-palette {
    background: #332618; border: 1px solid var(--border-color); color: #d6b885;
    padding: 6px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: all 0.2s;
  }
  .btn-toggle-palette:hover { background: #4a3723; color: white; }

  /* --- THANH TIẾN ĐỘ --- */
  #progressBarContainer {
    position: fixed;
    top: 60px; 
    left: 0; 
    width: 100%; 
    height: 3px;
    background: rgba(255, 255, 255, 0.05); 
    z-index: 999;
  }
  #progressBar {
    height: 100%; 
    width: 0%;
    background: linear-gradient(to right, #fcd34d, #d97706);
    transition: width 0.3s ease;
  }

  /* --- LAYOUT CHÍNH --- */
  .container {
    display: flex;
    max-width: 1200px;
    margin: 60px auto 0;
    padding: 24px 16px 80px;
    gap: 24px;
    align-items: flex-start;
    justify-content: center; 
    width: 100%;
    flex: 1;
  }
  
  .main-content { 
    flex: 1; 
    max-width: 800px; 
    transition: max-width 0.3s ease;
  }
  
  /* --- SIDEBAR BẢNG CÂU --- */
  .sidebar {
    width: 260px; 
    position: sticky;
    top: 80px; 
    background: var(--bg-palette);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px 12px;
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
    transition: all 0.3s ease;
  }
  
  .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .sidebar-header h3 { margin: 0; font-size: 14px; color: #fcd34d; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
  
  .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; transition: opacity 0.3s; }
  
  .palette-btn {
    aspect-ratio: 1; border-radius: 50%; border: 1px solid #5c4228; background: #2a1e15; color: #d6b885;
    font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; padding: 0; box-shadow: none; 
  }
  .palette-btn:hover { background: #3d2b1d; border-color: #8a643b; color: white; }
  
  .palette-btn.selected { background: #4a2b10; color: #fcd34d; border-color: #d97706; }
  .palette-btn.correct { background: rgba(16, 185, 129, 0.2); color: #10b981; border-color: #10b981; }
  .palette-btn.wrong { background: rgba(239, 68, 68, 0.2); color: #ef4444; border-color: #ef4444; }
  
  .legend { margin-top: 20px; font-size: 12px; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 10px;}
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.selected { background: #fcd34d; }
  .dot.correct { background: var(--success); }
  .dot.wrong { background: var(--danger); }
  .dot.empty { background: #5c4228; }

  /* --- GIAO DIỆN CHUNG --- */
  .card { background: var(--bg-card); border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8); border: 1px solid var(--border-color); margin-bottom: 24px; }
  
  textarea { width: 100%; min-height: 220px; padding: 16px; font-family: Consolas, monospace; font-size: 15px; background: #110c08; color: #fde68a; border: 1px solid var(--border-color); border-radius: 12px; resize: vertical; outline: none; line-height: 1.5; }
  textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.2); }

  input[type="text"] { width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; background: #110c08; color: #fff; outline: none; margin-bottom: 15px;}

  button { padding: 10px 20px; font-size: 15px; font-weight: 600; font-family: inherit; border: none; border-radius: 10px; background: var(--primary); color: white; cursor: pointer; margin: 4px 4px 0 0; transition: all 0.2s ease; box-shadow: 0 4px 10px rgba(217, 119, 6, 0.3); }
  button:hover { background: var(--primary-hover); transform: translateY(-2px); }
  button.secondary { background: #332618; color: var(--text-main); box-shadow: none; border: 1px solid var(--border-color); }
  button.secondary:hover { background: #4a3723; }
  button.danger { background: var(--danger); box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3); }
  button.success { background: var(--success); box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }

  .hint { font-size: 14.5px; color: var(--text-muted); margin: 0 0 12px; }
  
  /* Khung câu hỏi */
  .question { background: var(--bg-card); border-radius: 16px; padding: 24px; margin-bottom: 16px; border: 1px solid var(--border-color); transition: all 0.3s; }
  .question:hover { border-color: #785b3e; }
  .question h3 { font-size: 18px; margin: 0 0 16px; color: #fef3c7; font-weight: 600; line-height: 1.5; }
  
  .option-label { display: flex; align-items: flex-start; padding: 14px 16px; border-radius: 12px; cursor: pointer; border: 1px solid var(--border-color); background: #1c140e; margin-bottom: 10px; transition: all 0.2s; font-size: 16px; }
  .option-label:hover { background: #2d2117; border-color: #785b3e; }
  .option-label input { display: none; }
  .option-circle { display: flex; align-items: center; justify-content: center; min-width: 30px; height: 30px; border-radius: 50%; background: #332618; color: #fcd34d; font-weight: 700; margin-right: 14px; border: 1px solid var(--border-color); font-size: 15px; }

  /* Trạng thái đáp án */
  .option-label.selected { border-color: var(--primary); background: rgba(217, 119, 6, 0.15); }
  .option-label.selected .option-circle { background: var(--primary); color: white; border-color: var(--primary); }
  .option-label.correct { background: rgba(16, 185, 129, 0.15) !important; border-color: var(--success) !important; }
  .option-label.correct .option-circle { background: var(--success) !important; color: white !important; border-color: var(--success) !important; }
  .option-label.wrong { background: rgba(239, 68, 68, 0.15) !important; border-color: var(--danger) !important; }
  .option-label.wrong .option-circle { background: var(--danger) !important; color: white !important; border-color: var(--danger) !important; }

  .timer { font-size: 16px; font-weight: 700; color: #fcd34d; display: flex; align-items: center; gap: 6px; }
  .timer.warning { color: #ef4444; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  .status { font-size: 14.5px; font-weight: 600; margin-top: 10px; }
  .hidden { display: none !important; }
  .flex-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  input[type="number"] { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 8px; width: 80px; font-size: 16px; background: #110c08; color: #fcd34d; outline: none; font-weight: bold; }

  #result { text-align: center; margin: 20px 0; }
  .score-box { background: linear-gradient(135deg, #241b13 0%, #332618 100%); padding: 30px; border-radius: 20px; border: 2px solid var(--primary); box-shadow: 0 0 30px rgba(217, 119, 6, 0.2); }

  /* --- QUẢN LÝ ĐỀ THI (DASHBOARD) --- */
  .quiz-list { display: flex; flex-direction: column; gap: 12px; }
  .quiz-item {
    background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;
    padding: 16px; display: flex; justify-content: space-between; align-items: center;
    transition: all 0.2s;
  }
  .quiz-item:hover { border-color: var(--primary); background: #2a1f16; }
  .quiz-info h4 { margin: 0 0 4px; color: #fcd34d; font-size: 18px; }
  .quiz-info p { margin: 0; color: var(--text-muted); font-size: 14px; }
  .quiz-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  @media (max-width: 850px) {
    .container { flex-direction: column; margin-top: 60px; }
    .sidebar { width: 100%; position: static; order: -1; margin-bottom: 20px;}
    .palette { grid-template-columns: repeat(8, 1fr); }
    .top-bar { flex-direction: column; height: auto; padding: 10px; gap: 10px; }
    .container { margin-top: 100px; }
    #progressBarContainer { top: 100px; }
    .quiz-item { flex-direction: column; align-items: flex-start; gap: 12px; }
  }
</style>
</head>
<body>

<!-- THANH TOP BAR -->
<div class="top-bar">
  <div class="top-left">
    <span id="currentQuestionText">Trang Chủ</span>
  </div>
  <div class="top-right">
    <div id="scoreBoard" class="hidden" style="display:flex; gap:8px;">
      <div class="score-badge correct">✔ Đúng: <span id="scoreCorrect">0</span></div>
      <div class="score-badge wrong">✘ Sai: <span id="scoreWrong">0</span></div>
    </div>
    <button id="btnTogglePalette" class="btn-toggle-palette hidden" onclick="toggleSidebar()">☰ Thu nhỏ</button>
    <div id="timerDisplay" class="timer hidden">⏱️ 15:00</div>
    <button id="btnBackHome" class="secondary hidden" onclick="backToHome()" style="margin:0;">← Trang chủ</button>
  </div>
</div>

<div id="progressBarContainer"><div id="progressBar"></div></div>

<div class="container">
  
  <!-- CỘT TRÁI -->
  <div class="main-content">
    
    <!-- 1. GIAO DIỆN QUẢN LÝ ĐỀ THI -->
    <div id="homePanel">
      <div class="flex-row" style="justify-content: space-between; margin-bottom: 20px;">
        <h2 style="margin:0; color:#fcd34d; font-size: 24px;">📚 Kho Đề Thi Của Bạn</h2>
        <button onclick="showCreateForm()">+ Tạo Đề Mới</button>
      </div>
      <div id="quizList" class="quiz-list">
        <!-- Các bộ đề sẽ được render ở đây -->
      </div>
    </div>

    <!-- 2. GIAO DIỆN TẠO ĐỀ MỚI -->
    <div id="createPanel" class="hidden">
      <div class="card">
        <h2 style="margin-top:0; color:#fcd34d;">Tạo / Sửa Bộ Đề</h2>
        
        <label style="color:#fff; font-weight:bold; display:block; margin-bottom:5px;">Tên bộ đề:</label>
        <input type="text" id="quizTitleInput" placeholder="VD: Đề cương Tư tưởng HCM...">
        
        <p class="hint"><b>Hướng dẫn dán đề:</b> Các câu cách nhau 1 dòng trống. Cuối mỗi câu phải có <b>Đáp án: A</b> (hoặc B, C, D).</p>
        <textarea id="inputText" placeholder="Dán câu hỏi của bạn vào đây..."></textarea>
        
        <div class="flex-row" style="margin-top: 20px;">
          <label style="color:#fcd34d; font-weight:bold; font-size:16px;">⏱️ Thời gian:</label>
          <input type="number" id="timeInput" value="15" min="1" max="180">
          <span style="color:var(--text-muted); font-size:16px;">phút</span>
        </div>

        <div style="margin-top:15px">
          <button onclick="saveQuiz()">💾 Lưu Bộ Đề</button>
          <button class="secondary" onclick="loadSample()">Xem mẫu</button>
          <button class="danger" onclick="hideCreateForm()">Hủy</button>
        </div>
        <div class="status" id="status"></div>
      </div>
    </div>

    <!-- 3. GIAO DIỆN LÀM BÀI -->
    <div id="quizPanel" class="hidden">
      <div id="quizContainer"></div>
      
      <!-- Nút Share Link -->
      <div id="sharePanel" class="hidden" style="text-align: center; margin-top: 20px; padding: 15px; background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); border-radius: 12px;">
        <p style="margin: 0 0 10px; color: var(--success); font-weight: bold;">🎉 Gửi link này cho bạn bè để cùng làm:</p>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="shareLinkInput" readonly style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--success); background: #110c08; color: #fcd34d; font-size: 14px; margin:0;">
          <button class="success" onclick="copyShareLink()">Copy Link</button>
        </div>
      </div>

      <div style="margin-top: 30px; display: flex; justify-content: space-between;">
        <button id="btnPrev" class="secondary" onclick="prevQuestion()" style="visibility: hidden;">← Câu trước</button>
        <button id="btnNext" onclick="nextQuestion()">Câu tiếp theo →</button>
        <button id="btnFinish" class="danger hidden" onclick="finishQuiz()">Nộp bài</button>
      </div>
      
      <div id="result"></div>
    </div>
  </div>

  <!-- CỘT PHẢI (BẢNG CÂU) -->
  <div id="sidebarPanel" class="sidebar hidden">
    <div class="sidebar-header">
      <h3>📋 BẢNG CÂU</h3>
      <button class="toggle-btn" onclick="toggleSidebar()">&lt;</button>
    </div>
    <div class="palette" id="paletteGrid"></div>
    <div class="legend">
      <div class="legend-item"><div class="dot selected"></div> Đang làm</div>
      <div class="legend-item"><div class="dot correct"></div> Đúng</div>
      <div class="legend-item"><div class="dot wrong"></div> Sai</div>
      <div class="legend-item"><div class="dot empty"></div> Chưa làm</div>
    </div>
  </div>

</div>

<script>
const STORAGE_KEY = "quiz_management_v1";
let allQuizzes = []; // Lưu tất cả các bộ đề
let currentQuizData = null; // Bộ đề đang làm
let currentQuiz = [];
let answers = {}; 
let currentQIndex = 0;
let submitted = false;
let editingQuizId = null; // Đang sửa đề nào (null là tạo mới)

let timerInterval = null;
let timeLeft = 0;

/* ============ ĐIỀU HƯỚNG GIAO DIỆN ============ */
function hideAllPanels() {
  document.getElementById("homePanel").classList.add("hidden");
  document.getElementById("createPanel").classList.add("hidden");
  document.getElementById("quizPanel").classList.add("hidden");
  document.getElementById("sidebarPanel").classList.add("hidden");
  document.getElementById("scoreBoard").classList.add("hidden");
  document.getElementById("timerDisplay").classList.add("hidden");
  document.getElementById("btnTogglePalette").classList.add("hidden");
  document.getElementById("btnBackHome").classList.add("hidden");
  document.getElementById("currentQuestionText").textContent = "Trang Chủ";
  document.getElementById("progressBar").style.width = "0%";
}

function backToHome() {
  if (!confirm("Bạn có chắc muốn thoát? Tiến trình làm bài sẽ bị hủy.")) return;
  if (timerInterval) clearInterval(timerInterval);
  hideAllPanels();
  document.getElementById("homePanel").classList.remove("hidden");
  document.getElementById("btnBackHome").classList.remove("hidden");
  renderHome();
}

function showCreateForm(isEdit = false) {
  hideAllPanels();
  document.getElementById("createPanel").classList.remove("hidden");
  document.getElementById("btnBackHome").classList.remove("hidden");
  document.getElementById("currentQuestionText").textContent = isEdit ? "Sửa Đề" : "Tạo Đề Mới";
  
  if (!isEdit) {
    editingQuizId = null;
    document.getElementById("quizTitleInput").value = "";
    document.getElementById("inputText").value = "";
    document.getElementById("timeInput").value = "15";
    setStatus("", "");
  }
}

function hideCreateForm() {
  hideAllPanels();
  document.getElementById("homePanel").classList.remove("hidden");
  document.getElementById("btnBackHome").classList.remove("hidden");
  renderHome();
}

/* ============ QUẢN LÝ KHO ĐỀ (LOCAL STORAGE) ============ */
function loadData() {
  const data = localStorage.getItem(STORAGE_KEY);
  if (data) {
    try { allQuizzes = JSON.parse(data); } catch(e) { allQuizzes = []; }
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(allQuizzes));
}

function renderHome() {
  const listEl = document.getElementById("quizList");
  if (allQuizzes.length === 0) {
    listEl.innerHTML = `<div style="text-align:center; padding: 40px; color:var(--text-muted);">Chưa có bộ đề nào. Bấm "Tạo Đề Mới" để bắt đầu nhé!</div>`;
    return;
  }

  listEl.innerHTML = allQuizzes.map(q => `
    <div class="quiz-item">
      <div class="quiz-info">
        <h4>${escapeHtml(q.title)}</h4>
        <p>Số câu: ${q.questions.length} | Thời gian: ${q.time} phút</p>
      </div>
      <div class="quiz-actions">
        <button class="success" onclick="startSavedQuiz('${q.id}')">▶ Làm Bài</button>
        <button class="secondary" onclick="shareSavedQuiz('${q.id}')">🔗 Share</button>
        <button class="secondary" onclick="editQuiz('${q.id}')">✏️ Sửa</button>
        <button class="danger" onclick="deleteQuiz('${q.id}')">🗑 Xóa</button>
      </div>
    </div>
  `).join("");
}

/* ============ TẠO / SỬA / XÓA ĐỀ ============ */
function saveQuiz() {
  const title = document.getElementById("quizTitleInput").value.trim();
  const text = document.getElementById("inputText").value;
  const time = parseInt(document.getElementById("timeInput").value) || 15;
  
  if (!title) { setStatus("Vui lòng nhập tên bộ đề!", "red"); return; }
  if (!text.trim()) { setStatus("Bạn chưa dán câu hỏi nào!", "red"); return; }

  const { result, errors } = parseQuestions(text);
  if (errors.length > 0) { setStatus("Lỗi:\n" + errors.join("\n"), "red"); return; }
  if (!result.length) { setStatus("Không có câu hỏi hợp lệ.", "red"); return; }

  if (editingQuizId) {
    // Sửa
    const index = allQuizzes.findIndex(q => q.id === editingQuizId);
    if (index !== -1) {
      allQuizzes[index] = { ...allQuizzes[index], title, questions: result, time };
    }
  } else {
    // Tạo mới
    const newQuiz = { id: Date.now().toString(), title, questions: result, time };
    allQuizzes.unshift(newQuiz); // Đưa lên đầu
  }
  
  saveData();
  hideCreateForm();
}

function editQuiz(id) {
  const quiz = allQuizzes.find(q => q.id === id);
  if (!quiz) return;
  
  editingQuizId = id;
  showCreateForm(true);
  
  document.getElementById("quizTitleInput").value = quiz.title;
  document.getElementById("timeInput").value = quiz.time;
  
  // Chuyển mảng câu hỏi thành text để sửa
  document.getElementById("inputText").value = quiz.questions.map((item, idx) => {
    const opts = item.options.map((o, i) => `${String.fromCharCode(65 + i)}. ${o}`).join("\n");
    return `Câu ${idx + 1}: ${item.q}\n${opts}\nĐáp án: ${String.fromCharCode(65 + item.answer)}`;
  }).join("\n\n");
}

function deleteQuiz(id) {
  if (!confirm("Bạn có chắc muốn xóa bộ đề này? Thao tác không thể hoàn tác.")) return;
  allQuizzes = allQuizzes.filter(q => q.id !== id);
  saveData();
  renderHome();
}

/* ============ SHARE LINK ============ */
function shareSavedQuiz(id) {
  const quiz = allQuizzes.find(q => q.id === id);
  if (!quiz) return;
  try {
    const jsonStr = JSON.stringify(quiz.questions);
    const base64 = btoa(unescape(encodeURIComponent(jsonStr)));
    const baseUrl = window.location.origin + window.location.pathname;
    const shareUrl = `${baseUrl}?data=${base64}`;
    
    navigator.clipboard.writeText(shareUrl);
    alert("Đã copy link chia sẻ bộ đề [" + quiz.title + "]! Hãy gửi cho bạn bè.");
  } catch(e) {
    alert("Có lỗi khi tạo link chia sẻ!");
  }
}

function checkUrlParams() {
  const urlParams = new URLSearchParams(window.location.search);
  const data = urlParams.get('data');
  if (data) {
    try {
      const decodedStr = decodeURIComponent(escape(atob(data)));
      const decodedQuestions = JSON.parse(decodedStr);
      if (Array.isArray(decodedQuestions) && decodedQuestions.length > 0) {
        
        // Tạo một object quiz tạm để bắt đầu
        const sharedQuiz = {
          id: "shared_" + Date.now(),
          title: "Đề được chia sẻ",
          questions: decodedQuestions,
          time: 15 // Mặc định 15 phút
        };
        
        window.history.replaceState({}, document.title, window.location.pathname);
        beginQuizSession(sharedQuiz);
        return true; 
      }
    } catch (e) {
      alert("Link chia sẻ bị lỗi hoặc đã bị cắt ngắn!");
    }
  }
  return false;
}

/* ============ BẮT ĐẦU LÀM BÀI ============ */
function startSavedQuiz(id) {
  const quiz = allQuizzes.find(q => q.id === id);
  if (quiz) beginQuizSession(quiz);
}

function beginQuizSession(quizData) {
  currentQuizData = quizData;
  
  // Random câu và đáp án
  currentQuiz = quizData.questions.map(item => {
    const correctText = item.options[item.answer];
    const opts = [...item.options].sort(() => Math.random() - 0.5);
    return { q: item.q, options: opts, answer: opts.indexOf(correctText) };
  }).sort(() => Math.random() - 0.5);

  submitted = false;
  answers = {};
  currentQIndex = 0;
  
  hideAllPanels();
  document.getElementById("quizPanel").classList.remove("hidden");
  document.getElementById("sidebarPanel").classList.remove("hidden");
  document.getElementById("scoreBoard").classList.remove("hidden");
  document.getElementById("btnTogglePalette").classList.remove("hidden");
  document.getElementById("timerDisplay").classList.remove("hidden");
  document.getElementById("result").innerHTML = "";
  
  // Tự động tạo link share nếu đang làm đề tự tạo (không phải đề share)
  if (!quizData.id.startsWith("shared_")) {
    try {
      const jsonStr = JSON.stringify(quizData.questions);
      const base64 = btoa(unescape(encodeURIComponent(jsonStr)));
      const baseUrl = window.location.origin + window.location.pathname;
      document.getElementById("shareLinkInput").value = `${baseUrl}?data=${base64}`;
      document.getElementById("sharePanel").classList.remove("hidden");
    } catch(e) {}
  }

  document.getElementById("scoreCorrect").textContent = "0";
  document.getElementById("scoreWrong").textContent = "0";
  
  renderPalette();
  renderCurrentQuestion();

  timeLeft = quizData.time * 60;
  updateTimerDisplay();
  
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      alert("⏰ Đã hết thời gian! Hệ thống tự động nộp bài.");
      finishQuiz();
    }
  }, 1000);
}

/* ============ CÁC HÀM XỬ LÝ LÀM BÀI (GIỮ NGUYÊN) ============ */
function copyShareLink() {
  const copyText = document.getElementById("shareLinkInput");
  copyText.select();
  copyText.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(copyText.value);
  alert("Đã copy link! Bạn có thể gửi cho bạn bè ngay bây giờ.");
}

function toggleSidebar() {
  document.getElementById("sidebarPanel").classList.toggle("collapsed");
}

function parseQuestions(text) {
  const blocks = text.replace(/\r\n/g, '\n').trim().split(/\n\s*\n/);
  const result = [];
  const errors = [];

  blocks.forEach((block, idx) => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length < 3) return;

    let q = "", options = [], answer = -1;
    lines.forEach(line => {
      const lower = line.toLowerCase();
      if (lower.startsWith('đáp án:') || lower.startsWith('đáp án :') || lower.match(/^đáp án\s+[a-d]/)) {
        const match = line.match(/[A-D]/i);
        if (match) answer = "ABCD".indexOf(match[0].toUpperCase());
      } 
      else if (/^[A-D][\.\:\)]\s*/.test(line)) {
        const parts = line.split(/(?=[A-D][\.\:\)]\s*)/i).map(p => p.trim()).filter(Boolean);
        parts.forEach(part => {
          const match = part.match(/^[A-D][\.\:\)]\s*(.+)$/i);
          if (match) options.push(match[1].trim());
        });
      } 
      else if (!q) { q = line.replace(/^Câu\s*\d+\s*[:\.]?\s*/i, "").trim(); }
    });

    if (q && options.length >= 2 && answer !== -1) {
      if (options.length > 4) options = options.slice(0, 4); 
      result.push({ q, options, answer });
    } else {
      errors.push(`Khối ${idx + 1} bị lỗi định dạng.`);
    }
  });
  return { result, errors };
}

function renderCurrentQuestion() {
  if (submitted) return;
  const item = currentQuiz[currentQIndex];
  const state = answers[currentQIndex] || { chosen: -1, isCorrect: null };
  
  document.getElementById("currentQuestionText").textContent = `${currentQuizData.title} (Câu ${currentQIndex + 1}/${currentQuiz.length})`;
  updateProgress();

  document.getElementById("btnPrev").style.visibility = currentQIndex === 0 ? "hidden" : "visible";
  
  if (currentQIndex === currentQuiz.length - 1) {
    document.getElementById("btnNext").classList.add("hidden");
    document.getElementById("btnFinish").classList.remove("hidden");
  } else {
    document.getElementById("btnNext").classList.remove("hidden");
    document.getElementById("btnFinish").classList.add("hidden");
  }

  if (currentQIndex > 0) document.getElementById("sharePanel").classList.add("hidden");
  else if (currentQuizData && !currentQuizData.id.startsWith("shared_")) document.getElementById("sharePanel").classList.remove("hidden");

  const quizDiv = document.getElementById("quizContainer");
  quizDiv.innerHTML = `
    <div class="question" id="question-${currentQIndex}">
      <h3>Câu ${currentQIndex + 1}: ${escapeHtml(item.q)}</h3>
      ${item.options.map((opt, j) => {
        let labelClass = "option-label";
        let iconHtml = "";
        if (state.chosen !== -1) { 
          if (j === item.answer) { labelClass += " correct"; iconHtml = " <span style='color:var(--success); font-weight:bold; margin-left:auto;'>✓</span>"; }
          if (j === state.chosen && j !== item.answer) { labelClass += " wrong"; iconHtml = " <span style='color:var(--danger); font-weight:bold; margin-left:auto;'>✗</span>"; }
        }
        return `
          <label class="${labelClass}" onclick="selectOption(${j})">
            <div class="option-circle">${String.fromCharCode(65 + j)}</div>
            <div style="flex:1; margin-top:2px;">${escapeHtml(opt)}</div>
            ${iconHtml}
          </label>
        `;
      }).join("")}
    </div>
  `;
}

function selectOption(chosenIndex) {
  if (submitted || answers[currentQIndex]) return; 
  const item = currentQuiz[currentQIndex];
  const isCorrect = chosenIndex === item.answer;
  answers[currentQIndex] = { chosen: chosenIndex, isCorrect };
  updateScoreDisplay();
  updatePaletteStatus(currentQIndex, isCorrect ? "correct" : "wrong");
  renderCurrentQuestion();
}

function updateScoreDisplay() {
  let correct = 0, wrong = 0;
  for (let key in answers) {
    if (answers[key].isCorrect) correct++;
    else wrong++;
  }
  document.getElementById("scoreCorrect").textContent = correct;
  document.getElementById("scoreWrong").textContent = wrong;
}

function updateProgress() {
  const answered = Object.keys(answers).length;
  const percent = (answered / currentQuiz.length) * 100;
  document.getElementById("progressBar").style.width = percent + "%";
}

function nextQuestion() {
  if (currentQIndex < currentQuiz.length - 1) {
    currentQIndex++;
    renderCurrentQuestion();
  }
}

function prevQuestion() {
  if (currentQIndex > 0) {
    currentQIndex--;
    renderCurrentQuestion();
  }
}

function jumpToQuestion(index) {
  if (submitted) return;
  currentQIndex = index;
  renderCurrentQuestion();
}

function renderPalette() {
  const grid = document.getElementById("paletteGrid");
  grid.innerHTML = currentQuiz.map((_, i) => {
    let statusClass = "";
    if (answers[i]) {
      statusClass = answers[i].isCorrect ? "correct" : "wrong";
    } else if (i === currentQIndex) {
      statusClass = "selected";
    }
    return `<button class="palette-btn ${statusClass}" id="btn-q-${i}" onclick="jumpToQuestion(${i})">${i + 1}</button>`;
  }).join("");
}

function updatePaletteStatus(qIndex, status) {
  const btn = document.getElementById(`btn-q-${qIndex}`);
  if (!btn) return;
  btn.classList.remove("selected", "correct", "wrong");
  btn.classList.add(status);
}

function updateTimerDisplay() {
  const el = document.getElementById("timerDisplay");
  if (submitted) {
    el.textContent = "Đã nộp";
    el.classList.remove("warning");
    return;
  }
  const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
  const s = (timeLeft % 60).toString().padStart(2, '0');
  el.textContent = `⏱️ ${m}:${s}`;
  if (timeLeft < 60) el.classList.add("warning");
  else el.classList.remove("warning");
}

function finishQuiz() {
  if (submitted) return;
  submitted = true;
  clearInterval(timerInterval);
  updateTimerDisplay();

  let correct = 0;
  const wrongList = [];

  currentQuiz.forEach((item, i) => {
    if (answers[i] && answers[i].isCorrect) {
      correct++;
    } else {
      wrongList.push(item);
      updatePaletteStatus(i, "wrong"); 
    }
  });

  const pct = Math.round(correct / currentQuiz.length * 100);
  
  let actionHtml = "";
  if (wrongList.length > 0) {
    actionHtml = `<button class="danger" onclick='beginQuizSession({id: "retry_${Date.now()}", title: "Luyện câu sai", questions: ${JSON.stringify(wrongList)}, time: 15})' style="margin-top:15px; padding: 12px 24px;">🎯 Luyện lại ${wrongList.length} câu sai</button>`;
  }

  document.getElementById("quizContainer").innerHTML = ""; 
  document.getElementById("sharePanel").classList.add("hidden"); 
  document.getElementById("btnPrev").classList.add("hidden");
  document.getElementById("btnNext").classList.add("hidden");
  document.getElementById("btnFinish").classList.add("hidden");

  document.getElementById("result").innerHTML = `
    <div class="score-box">
      <h2 style="color: #fcd34d; margin-top:0; font-size: 28px;">Hoàn Thành!</h2>
      <div style="font-size: 22px; margin: 15px 0;">Bạn đúng <b>${correct}/${currentQuiz.length}</b> câu</div>
      <div style="font-size: 36px; font-weight: 700; color: ${pct >= 50 ? 'var(--success)' : 'var(--danger)'}; margin-bottom: 20px;">${pct}%</div>
      <div>
        <button class="secondary" onclick="beginQuizSession(currentQuizData)" style="padding: 12px 24px;">🔄 Làm lại bộ đề này</button>
        ${actionHtml}
        <button class="primary" onclick="backToHome()" style="padding: 12px 24px; margin-left:10px;">🏠 Về Trang Chủ</button>
      </div>
    </div>
  `;
}

function setStatus(msg, color) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.style.color = color === "red" ? "#ef4444" : "#10b981";
  el.style.whiteSpace = "pre-line";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* Khởi động */
(function init() {
  loadData();
  
  // Nếu mở bằng link share
  const isShared = checkUrlParams();
  
  if (!isShared) {
    hideAllPanels();
    document.getElementById("homePanel").classList.remove("hidden");
    document.getElementById("btnBackHome").classList.remove("hidden");
    document.getElementById("currentQuestionText").textContent = "Trang Chủ";
    renderHome();
  }
})();
</script>
